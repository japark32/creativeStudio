<!-- Create page: expands the fourth card into an invitation to make the experience your own. -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Metadata makes the page a complete document and keeps its framed view responsive. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Make the next beginning your own.">
    <title>Create — Make it yours</title>
    <!-- Shared styles define the card layout; the local sheet assigns Create's artwork accent. -->
    <link rel="stylesheet" href="shared/card-page.css">
    <link rel="stylesheet" href="create/create.css">
  </head>
  <body data-page="create">
    <!-- Create page content develops the fourth card's short sample into a personal invitation. -->
    <main class="card-page">
      <p class="card-page__eyebrow">04 / Create</p>
      <h1>Make it yours</h1>
      <p class="card-page__lead">Your story starts right here. Choose a direction, add your own color, and let the next small step become something only you could make.</p>
      <hr class="card-page__rule">
      <div class="card-page__art" aria-hidden="true">✦</div>
    </main>
    <!-- Shared keyboard handler keeps the enclosing dialog dismissible and keyboard-trapped. -->
    <script src="shared/card-page.js"></script>
  </body>
</html>
