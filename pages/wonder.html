<!-- Wonder page: expands the third card with a note about discovery and curiosity. -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Page metadata supports readable direct access and a viewport-sized dialog frame. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Stay curious and discover what is waiting around the corner.">
    <title>Wonder — Stay curious</title>
    <!-- Shared styles define the card layout; the local sheet assigns Wonder's artwork accent. -->
    <link rel="stylesheet" href="shared/card-page.css">
    <link rel="stylesheet" href="wonder/wonder.css">
  </head>
  <body data-page="wonder">
    <!-- Wonder content elaborates on the card's invitation to explore. -->
    <main class="card-page">
      <p class="card-page__eyebrow">03 / Wonder</p>
      <h1>Stay curious</h1>
      <p class="card-page__lead">There’s always more to discover. Follow a small detail, ask one more question, and give the unexpected somewhere to find you.</p>
      <hr class="card-page__rule">
      <div class="card-page__art" aria-hidden="true">✳</div>
    </main>
    <!-- Shared keyboard handler keeps the enclosing dialog dismissible and keyboard-trapped. -->
    <script src="shared/card-page.js"></script>
  </body>
</html>
