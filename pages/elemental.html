<!-- Elemental page: renders an interactive, color-coded periodic table in the first card dialog. -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Metadata keeps this standalone page readable in browsers and responsive inside the dialog iframe. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore an interactive periodic table of all 118 elements.">
    <title>Periodic Table of Elements</title>
    <!-- Shared styles set the base theme; the local sheet defines the periodic table and its responsive detail panel. -->
    <link rel="stylesheet" href="shared/card-page.css">
    <link rel="stylesheet" href="elemental/elemental.css">
  </head>
  <body data-page="elemental">
    <!-- A table-only canvas keeps the periodic chart as the page's sole feature. -->
    <main class="elemental-page" id="elemental-page">
      <!-- Element buttons occupy the standard 18-column grid, with their detail panel beside the chart. -->
      <div class="periodic-table-wrap">
        <ol class="periodic-table" id="periodic-table" aria-label="118 chemical elements in atomic-number order"></ol>
      </div>
      <!-- Selected-element detail places atomic mass, group, and period in the same compact card style as valence electrons. -->
      <section class="element__description" id="element-description" data-side="right" aria-live="polite" aria-label="Element details" hidden>
        <button class="element__description-close" id="element-close" type="button" aria-label="Close element details">×</button>
        <div class="element__description-topline" id="detail-number"></div>
        <div class="element__description-identity">
          <p class="element__description-symbol" id="detail-symbol"></p>
          <h2 class="element__description-name" id="detail-name"></h2>
        </div>
        <div class="element__description-category" id="detail-category"></div>
        <div class="element__description-valence">
          <span class="element__description-valence-label">Valence electrons</span>
          <span id="detail-valence"></span>
        </div>
        <div class="element__description-properties" aria-label="Periodic table information">
          <div class="element__description-property">
            <span class="element__description-valence-label">Mass</span>
            <span id="detail-mass"></span>
          </div>
          <div class="element__description-property">
            <span class="element__description-valence-label">Group / series</span>
            <span id="detail-group"></span>
          </div>
          <div class="element__description-property">
            <span class="element__description-valence-label">Period</span>
            <span id="detail-period"></span>
          </div>
        </div>
        <p class="element__description-copy" id="detail-copy"></p>
      </section>
      <!-- The legend explains the category tints without adding another table heading. -->
      <aside class="element-legend" id="element-legend" aria-label="Element categories"></aside>
    </main>

    <!-- Page controller builds the periodic table and manages element details and keyboard use. -->
    <script src="elemental/elemental.js"></script>
    <!-- Shared keyboard handler returns Escape and Tab actions to the containing dialog. -->
    <script src="shared/card-page.js"></script>
  </body>
</html>
