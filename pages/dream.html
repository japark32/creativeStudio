<!-- Dream page: expands the second card into a quiet moment about imagination and rest. -->

<html lang="en">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find your rhythm and dream at your own pace.">
    <title>Dream — Find your rhythm</title>
    <!-- Reuse the shared card-page design for consistent typography and responsive spacing. -->
    <link rel="stylesheet" href="card-page.css">
  </head>
  <body data-page="dream">
    <!-- Dream content expands the second card's sample into a short, reflective message. -->
    <main class="card-page">
      <p class="card-page__eyebrow">02 / Dream</p>
      <h1>Find your rhythm</h1>
      <p class="card-page__lead">Take it one moment at a time. Let the day slow down enough for an idea to take shape, then follow it wherever it leads.</p>
      <hr class="card-page__rule">
      <div class="card-page__art" aria-hidden="true">☾</div>
    </main>
    <!-- Shared keyboard handler keeps the enclosing dialog dismissible and keyboard-trapped. -->
    <script src="card-page.js"></script>
